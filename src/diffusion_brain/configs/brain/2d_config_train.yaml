wandb:
  project_name: conditional-2d-diffusion-brain

state: train 

diffusion:
  diffusion_type: vp
  T: 1.0 #1000.0 # 1.0
  eps: 1.e-3 # time epsilon for the reverse timegrid
  beta_min: 0.1 #0.01 #0.1 #1.e-4 #0.01 #1.e-3 #1.e-4 # 0.01
  beta_max: 20.0 #10.0 #20.0 #0.02 #10.0 #1.e-2 #0.02 # 10.0

  max_diffusivity: ~

  # diffusion_type: ve
  # timesteps: 1000
  # sigma_min: 0.01
  # sigma_max: 50
  # T: 1.0 #1000.0
  # eps: 1.e-3 # time epsilon for the reverse timegrid

# do i want to have a joint dataloader that will take care of both ANN and fmri data? 
data:
  data_name: ann-brain
  is_2d: true
  grid_resolution_2d: 1.0 #1.0 # in mm, for 2d case only, it will determine the grid size based on the bounding box of the ROI vertices;
  resize_to_multiple: 8 #64 # for 2d case, pad the images to be divisible by this number to ensure compatibility with UNet downsampling/upsampling; should be power of 2 (e.g., 16, 32, 64) depending on the number of stages in UNet
  images_data_path: './src/diffusion_brain/data/data_coco/'
  behav_data_root: './src/diffusion_brain/data/behav/'
  subj: "subj01"
  fmri_data_root: '/data/datapool3/datasets/nsd_betas_condavg/' # TODO: add this as BIND to bash script
  fmri_data_name: 'betas_average_fsaverage.npy'
  ann_model: "vit_b_16" #"resnet50" 
  ann_model_weights: "IMAGENET1K_SWAG_E2E_V1" # "IMAGENET1K_V1" #"IMAGENET1K_V2" # old interface "ResNet50_Weights.IMAGENET1K_V2"
  ann_activations_data_path: './src/diffusion_brain/data/ann_activations/'
  layer_name: "encoder.layers.encoder_layer_11.mlp" #"avgpool"
  roi: 5 #18 #10 #5 # do the correct indexing as described in roi_defs/streams.mgz.ctab
  roi_defs_dir: './src/diffusion_brain/data/roi_defs/'
  roi_file: "streams" #"streams" #"HCP_MMP1" # can be streams or HCP_MMP1 or nsdgeneral

# need to wire up the model arguments' with UNet class definition
model:
  name: unet-diffusers #gfdm-unet-1d-cond #dit #unet-diffusers #gfdm-unet #unet-diffusers # unet
  c_in: 1
  c_out: 1
  ################c cross-attention conditioning specific args (only used for unet-diffusers and gfdm-unet-1d-cond)##########################
  cond_seq_len: 8 #3 # num_tokens for ANNTokenizer (learned mode)
  token_dim: 256 # dimension of each token produced by ANNTokenizer
  num_classes: 1 # reserved for future subject-identity conditioning
  cond_token_mode: "learned" # "learned" uses ANNTokenizer; legacy: "chunk", "repeat"
  #########################################################################################
  # cross_attention_dim: 2048 # it should be equal to dimensionality of conditioning vector, is inferred during training
  # UNet block configuration — 4 levels with cross-attention at 3 spatial scales
  # block_out_channels: [64, 128, 256, 512]
  # down_block_types: ["DownBlock2D", "CrossAttnDownBlock2D", "CrossAttnDownBlock2D", "CrossAttnDownBlock2D"]
  # up_block_types: ["CrossAttnUpBlock2D", "CrossAttnUpBlock2D", "CrossAttnUpBlock2D", "UpBlock2D"]
  ######### dit############## depth=12, hidden_size=384, patch_size=8, num_heads=6
  num_heads: 12
  depth: 12
  hidden_size: 768
  ###########################
  dropout_prob: 0.1 #0.1 #0.1 #0.2 #0.2 #0.2 #0.2 # label dropout in classifier-free training
  lambda_cond_sep: 0.0 # weight for conditioning separation loss; set to 0.0 to disable
  save_freq: 5000
  output_folder: './model_outputs/ann-brain/'
  ######################### autoencoder settings for future use ######################################
  use_autoencoder: false
  ae_save_path: './model_outputs/ann-brain/autoencoder/'
  ae_name: 'ae_linear.pt'
  ae_latent_dim: 1024
  ae_epochs: 50
  ae_lr: 1.e-4

optim:
  loss: mse
  optim_name: adamw
  weight_decay: 1.e-3
  lr: 1.e-4 # for adam/optimiser
  scheduler_name: onecycle
  max_lr: 1.e-4

  # for plateau:
  # min_lr: 1e-6
  # scheduler_mode: "min"
  # factor: 0.7
  # patience: 50

train:
  resume_from: ~ #"./model_outputs/ann-brain/ann-brain-cluster-234770/checkpoint_step_15000.pth" # path to checkpoint file to resume training (e.g., ./model_outputs/ann-brain/ann-brain-cluster-229416/checkpoint_step_5000.pth)
  steps: 100000 #10000 #2000 # train steps
  batch_size: 8 # 32 on gpu5 # reduced for memory with CrossAttn blocks
  dataset_size: 9485 # 10000 - 515 images as train
  num_workers: 4
  histogram_freq: 1000 # frequency of logging loss histogram to wandb, set to 0 to disable
  use_mixed_precision: false #true  # Enable bfloat16 training
  gradient_accumulation_steps: 2 #4 #8  # effective batch size = batch_size * gradient_accumulation_steps
  gradient_checkpointing: false #true  #ue saves ~30-40% memory
  ema_decay: 0.9999  # EMA decay rate for shadow weights (0.0 to disable); used for validation/generation
  ema_warmup_steps: 5000  # ramp EMA decay from 0 to ema_decay over this many optimizer steps

# may need to combine this with either diffusion or validation or both
# for training don't need sampling parameters, may need to move it to the completely different evaluation config
# sampling:
#   n_steps: 100
#   guidance_scale: 0.8
#   label_to_generate: 8

validation:
  ode: false
  eval_freq: 1000 #100
  batch_size: 64 #128 on gpu5 #64 #32 # maybe we want batch size of 64 for validation and then display just the first batch in wandb?
  n_steps: 100 # SDE steps
  guidance_scale: 3.0 #3.0 #3.0 #3.0 #10.0 #0.8
  output_folder: '/outputs/ann-brain/'
  num_workers: 1
  label_to_generate: 1 # it needs to be removed later when refactoring diffusivity.py as in ann-brain case we have continuous conditioning vector and not class labels;
  debug_conditioning: true
  thresholding: static # none / static / dynamic; static clips to fMRI data [min, max], dynamic uses per-sample percentile
  dynamic_thresholding_percentile: 0.995 # only used when thresholding=dynamic