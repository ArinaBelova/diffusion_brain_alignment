wandb:
  project_name: conditional-diffusion-brain

state: train 

diffusion:
  diffusion_type: vp
  T: 1.0 #1000.0 # 1.0
  eps: 1.e-3 # time epsilon for the reverse timegrid
  beta_min: 0.1 #0.01 #0.1 #1.e-4 #0.01 #1.e-3 #1.e-4 # 0.01
  beta_max: 20.0 #10.0 #20.0 #0.02 #10.0 #1.e-2 #0.02 # 10.0

  max_diffusivity: ~

  # diffusion_type: ve
  # timesteps: 1000
  # sigma_min: 0.01
  # sigma_max: 50
  # T: 1.0 #1000.0
  # eps: 1.e-3 # time epsilon for the reverse timegrid

# do i want to have a joint dataloader that will take care of both ANN and fmri data? 
data:
  data_name: ann-brain
  is_2d: false
  images_data_path: './src/diffusion_brain/data/data_coco/'
  behav_data_root: './src/diffusion_brain/data/behav/'
  subj: "subj01"
  fmri_data_root: '/data/datapool3/datasets/nsd_betas_condavg/' # TODO: add this as BIND to bash script
  fmri_data_name: 'betas_average_fsaverage.npy'
  ann_model: "vit_b_16" #"resnet50" 
  ann_model_weights: "IMAGENET1K_SWAG_E2E_V1" #"IMAGENET1K_V2" # old interface "ResNet50_Weights.IMAGENET1K_V2"
  ann_activations_data_path: './src/diffusion_brain/data/ann_activations/'
  layer_name: "encoder.layers.encoder_layer_11.mlp" #"avgpool"
  roi: 5 #5 #18 #10 #5 # do the correct indexing as described in roi_defs/streams.mgz.ctab
  roi_defs_dir: './src/diffusion_brain/data/roi_defs/'
  roi_file: "streams" #"streams" #"HCP_MMP1" # can be streams or HCP_MMP1 or nsdgeneral

# need to wire up the model arguments' with UNet class definition
model:
  name: gfdm-unet-1d-cond #dit #unet-diffusers #gfdm-unet #unet-diffusers # unet
  num_classes: ~ # reserved for future subject-identity conditioning
  c_in: 1
  c_out: 1
  condition_mode: "additive" # "additive" (ANN added to time emb) or "cross_attention" (ANNTokenizer → encoder_out); only for gfdm-unet-1d-cond
  cond_proj_type: "mlp" # "linear" (single projection) or "mlp" (2-layer with SiLU); only for additive cond_mode
  time_embed_dim: ~ #1024 # ~ dimension of time embedding; only for gfdm-unet-1d-cond
  #cross_attention_dim: 768 # set dynamically from ANN activation dim
  ############ for cross-attention conditioning ############
  cond_seq_len: 8 # num_tokens for ANNTokenizer
  token_dim: 256 # dimension of each token produced by ANNTokenizer
  cond_token_mode: "learned" # "learned" uses ANNTokenizer; legacy: "chunk", "repeat"
  ##########################################################
  ######### dit############## depth=12, hidden_size=384, patch_size=8, num_heads=6
  num_heads: 12
  depth: 12
  hidden_size: 768
  ###########################
  dropout_prob: 0.1 # label dropout in classifier-free training
  save_freq: 5000
  output_folder: './model_outputs/ann-brain/'
  ############# autoencoder settings for future use #############
  use_autoencoder: false
  ae_save_path: './model_outputs/ann-brain/autoencoder/'
  ae_name: 'ae_linear.pt'
  ae_latent_dim: 1024
  ae_epochs: 50
  ae_lr: 1.e-4

optim:
  loss: mse
  optim_name: adamw
  weight_decay: 1.e-3
  lr: 1.e-4 # for adam/optimiser
  scheduler_name: onecycle
  max_lr: 1.e-4

  # for plateau:
  # min_lr: 1e-6
  # scheduler_mode: "min"
  # factor: 0.7
  # patience: 50

train:
  steps: 100000 #2000 # train steps
  batch_size: 32 # 64 # train batch size, may need to decrease it for the larger models and increase for smaller ones
  dataset_size: 9485 # 10000 - 515 images as train
  num_workers: 4
  histogram_freq: 100 # frequency of logging loss histogram to wandb, set to 0 to disable
  use_mixed_precision: false #true  # Enable bfloat16 training
  gradient_accumulation_steps: 2 #8  # effective batch size = 1 * 8 = 8
  gradient_checkpointing: false
  ema_decay: 0.999  # EMA decay rate for shadow weights (0.0 to disable); used for validation/generation
  ema_warmup_steps: 5000  # ramp EMA decay from 0 to ema_decay over this many optimizer steps
  resume_from: ~

# may need to combine this with either diffusion or validation or both
# for training don't need sampling parameters, may need to move it to the completely different evaluation config
# sampling:
#   n_steps: 100
#   guidance_scale: 0.8
#   label_to_generate: 8

validation:
  ode: false
  eval_freq: 1000
  batch_size: 64 #128 for ROI 18 #32 #256 # maybe we want batch size of 64 for validation and then display just the first batch in wandb?
  n_steps: 100 # SDE steps
  guidance_scale: 20.0 #5.0
  output_folder: '/outputs/ann-brain/'
  num_workers: 1
  label_to_generate: 1 # it needs to be removed later when refactoring diffusivity.py as in ann-brain case we have continuous conditioning vector and not class labels;
  debug_conditioning: true
  thresholding: none # none / static / dynamic; static clips to fMRI data [min, max], dynamic uses per-sample percentile
  dynamic_thresholding_percentile: 0.995 # only used when thresholding=dynamic
