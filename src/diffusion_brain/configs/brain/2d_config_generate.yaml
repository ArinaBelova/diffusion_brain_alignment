wandb:
  project_name: generate-conditional-2d-diffusion-brain

state: generate
seed: 42

diffusion:
  diffusion_type: vp
  T: 1.0 #1000.0 # 1.0
  eps: 1.e-3 # time epsilon for the reverse timegrid
  beta_min: 0.1 #0.1 #1.e-4 #0.01 #1.e-3 #1.e-4 # 0.01
  beta_max: 20.0 #20.0 #0.02 #10.0 #1.e-2 #0.02 # 10.0

  # diffusion_type: ve
  # timesteps: 1000
  # sigma_min: 0.01
  # sigma_max: 50
  # T: 1.0 #1000.0
  # eps: 1.e-3 # time epsilon for the reverse timegrid

data:
  data_name: ann-brain
  is_2d: true
  grid_resolution_2d: 1.0 # in mm, for 2d case only, it will determine the grid size based on the bounding box of the ROI vertices;
  resize_to_multiple: 64 # must match training config (236854 was trained with 64)
  images_data_path: './src/diffusion_brain/data/data_coco/'
  behav_data_root: './src/diffusion_brain/data/behav/'
  subj: "subj01"
  fmri_data_root: '/data/datapool3/datasets/nsd_betas_condavg/' # TODO: add this as BIND to bash script
  fmri_data_name: 'betas_average_fsaverage.npy'
  ann_model: "resnet50" 
  ann_model_weights: "ResNet50_Weights.IMAGENET1K_V2"
  ann_activations_data_path: './src/diffusion_brain/data/ann_activations/'
  layer_name: "encoder.layers.encoder_layer_11.mlp" #"avgpool"
  roi: 5 #18 #10 #5 # do the correct indexing as described in roi_defs/streams.mgz.ctab
  roi_defs_dir: './src/diffusion_brain/data/roi_defs/'
  roi_file: "streams" #"HCP_MMP1" # can be streams or HCP_MMP1 or nsdgeneral
  fmri_norm_mode: "active_std" #"active_std" #"global_std"

model:
  name: unet-diffusers #unet-diffusers #gfdm-unet #unet-diffusers # unet
  c_in: 1
  c_out: 1
  time_dim: 256
  condition_mode: "additive" #"additive" # "additive" adds the ANN vector to the time embedding, "cross_attention" projects the ANN vector to cross-attention tokens by ANNTokenizer; only relevant for unet-diffusers and gfdm-unet-1d-cond
  cond_token_mode: "learned" # must match training config
  cond_seq_len: 8 # num_tokens for ANNTokenizer
  token_dim: 256 # dimension of each token produced by ANNTokenizer
  num_classes: 8  # must match training config (num_identities for subject embedding)
  # cross_attention_dim: 2048 # it should be equal to dimensionality of conditioning vector! for now it's specifically re-written in the scripts
  # UNet block config — must match training config
  block_out_channels: [64, 128, 256, 512]
  down_block_types: ["DownBlock2D", "DownBlock2D", "DownBlock2D", "DownBlock2D"] # ["DownBlock2D", "CrossAttnDownBlock2D", "CrossAttnDownBlock2D", "CrossAttnDownBlock2D"]
  up_block_types: ["UpBlock2D", "UpBlock2D", "UpBlock2D", "UpBlock2D"] # ["CrossAttnUpBlock2D", "CrossAttnUpBlock2D", "CrossAttnUpBlock2D", "UpBlock2D"]
  remove_deep_conv: false
  input_folder: './model_outputs/ann-brain/ann-brain-cluster' #-197972/'
  run_id: 197972
  which: "best" #best  # best final all
  use_autoencoder: false
  ae_save_path: './model_outputs/ann-brain/autoencoder/'
  ae_name: 'ae_linear'
  ae_latent_dim: 1024
  ae_epochs: 50
  ae_lr: 1.e-4

validation:
  average_over_num_runs: 1 #2 #10
  ode: false
  batch_size: 64 #128 #64
  n_steps: 100 #100
  guidance_scale: 20.0 #0.8
  label_to_generate: 0 # STUB
  output_folder: './outputs/generated_samples/ann-brain/'
  num_workers: 1
  final_model_num: 100000
  thresholding: static #dynamic #static # none / static / dynamic; static clips to fMRI data [min, max], dynamic uses per-sample percentile
  dynamic_thresholding_percentile: 0.995 # only used when thresholding=dynamic