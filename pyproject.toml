[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "diffusion_bain_alignment"
version = "0.1.0"
description = "Diffusivity model training utilities"
authors = ["Arina Belova <arina.belova@hhi.fraunhofer.de>"]

[tool.setuptools.packages.find]
where = ["."]
include = ["utils", "scripts", "models", "data_utils", "configs"]

[tool.poetry.dependencies]
python = ">=3.8"
